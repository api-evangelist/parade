        carrier_mc_number:
          type: string
          example: '13122'
        carrier_email:
          type: string
          example: test@parade.ai
        carrier_user_contact_name:
          type: string
          example: Bob
        company_external_key:
          type: string
          example: reed
        offer_external_key:
          type: string
          example: 32o847o8234
        reason_message:
          type: string
          example: Too Heavy
    CarrierOnboardingStatus:
      type: object
      required:
      - dot_number
      - enable_quotes
      - enable_reservations
      - enabled_for_parade
      properties:
        dot_number:
          type: string
          example: A12123
          description: The DOT number of the carrier
        enable_quotes:
          type: boolean
          description: Determines whether or not a carrier can quote.
        enable_reservations:
          type: boolean
