aid: parade
name: Parade
description: >-
  Parade is an AI-powered capacity-management and carrier-access platform for freight brokers. It layers
  on top of a broker's existing Transportation Management System (TMS) and load boards to surface truck
  availability, syndicate loads to third-party loadboards and carriers, and digitally transact quotes and
  bookings. Parade's syndication APIs let integration partners search available loads, submit carrier
  quotes, book loads (Book Now), post available trucks, check carrier onboarding status, and receive
  digital-conversion and carrier-sync webhooks. Its CoDriver AI agent handles inbound carrier calls and
  emails. Parade is backed by Menlo Ventures and serves freight brokerages that have collectively
  transacted tens of billions of dollars in freight.
